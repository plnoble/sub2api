name: outbox-claim-ci

# Independent verification for the scheduler-outbox durable-claim change.
#
# Why a dedicated workflow: the production host must not compile Go any more (it
# was OOM-killed once by an unbounded build), and the real concurrency guarantees
# can only be shown against a real PostgreSQL. The upstream integration harness
# spins postgres/redis with testcontainers, so the runner's Docker does the work.
#
# Dispatch with:
#   gh workflow run outbox-claim-ci.yml --ref ci --repo <owner>/<repo> \
#      -f target_ref=<branch-or-sha> -f build_release=true
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "branch, tag or sha to verify"
        required: true
      build_release:
        description: "also build the release binary with the Makefile ldflags"
        required: false
        default: "false"
      version_override:
        description: "value for main.Version (empty = resolve-version.sh)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: build, unit and real-PostgreSQL concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0 # full history so Go can stamp vcs.revision

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true

      - name: Toolchain identity (must match go.mod)
        run: |
          go version
          go version | grep -q "go1.27.3" || { echo "::error::go.mod requires go 1.27.3"; exit 1; }
          git rev-parse HEAD

      - name: gofmt (must be clean)
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then echo "::error::gofmt needs to run on: $out"; exit 1; fi

      - name: go build ./...
        run: go build ./...

      - name: go vet (touched packages, unit + integration tags)
        run: |
          go vet ./internal/service/ ./internal/repository/
          go vet -tags=integration ./internal/repository/

      - name: Unit tests - new queue path and the untouched legacy path
        run: go test -count=1 -run 'PollOutbox' -v ./internal/service/

      - name: Regression - existing outbox tests
        run: go test -count=1 -run 'Outbox|SchedulerOutbox' -v ./internal/service/ ./internal/repository/

      - name: Real PostgreSQL consumer concurrency tests
        env:
          CI: "true"
        run: |
          go test -tags=integration -count=1 -timeout 900s \
            -run 'TestOutboxClaim' -v ./internal/repository/ 2>&1 | tee /tmp/outbox-claim-it.log
          grep -q '^--- PASS' /tmp/outbox-claim-it.log
          ! grep -q '^--- FAIL' /tmp/outbox-claim-it.log

      - name: Release build with the production Makefile recipe
        if: ${{ inputs.build_release == 'true' }}
        env:
          GOFLAGS: -mod=mod -buildvcs=true
        run: |
          set -eu
          head_sha="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="${{ inputs.version_override }}"
          if [ -z "$version" ]; then version="$(./scripts/resolve-version.sh)"; fi
          echo "building version=$version commit=$head_sha built=$built_at"
          # Same Makefile recipe as production; the extra -X flags stamp the fields
          # cmd/server/main.go prints in `--version` (Version, Commit, Date, BuildType).
          make build VERSION="$version" \
            LDFLAGS="-s -w -X main.Version=$version -X main.Commit=$head_sha -X main.Date=$built_at -X main.BuildType=release"
          ls -l bin/server
          echo "--- sha256 ---"
          sha256sum bin/server | tee /tmp/release.sha256
          echo "--- banner ---"
          ./bin/server --version 2>&1 | tee /tmp/release.version
          echo "--- buildinfo ---"
          go version -m bin/server | sed -n '1,6p'
          echo "--- provenance gates ---"
          stamped="$(go version -m bin/server | sed -n 's/.*vcs\.revision=\([0-9a-f]\{7,\}\).*/\1/p')"
          echo "HEAD=$head_sha stamped=$stamped"
          [ "$head_sha" = "$stamped" ] || { echo "::error::buildinfo is not stamped with the built commit (got '$stamped')"; exit 1; }
          go version -m bin/server | grep -q 'go1\.27\.3' || { echo "::error::wrong Go toolchain"; exit 1; }
          grep -q "Sub2API $version (commit: $head_sha, built: $built_at)" /tmp/release.version \
            || { echo "::error::banner missing version/commit/date"; cat /tmp/release.version; exit 1; }
          ! grep -qi 'commit: unknown' /tmp/release.version || { echo "::error::commit stamped as unknown"; exit 1; }
          echo "::notice title=release provenance::version=$version commit=$head_sha built=$built_at sha256=$(cut -d' ' -f1 /tmp/release.sha256)"
      - name: Upload the release binary
        if: ${{ inputs.build_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-release-${{ github.sha }}
          path: backend/bin/server
          if-no-files-found: error
          retention-days: 14
